group = 'com.devgraphx'
version = '1.0.0'

subprojects {
    group = rootProject.group
    version = rootProject.version

    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
        }
    }
}
